<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cerebro Login</title>

<style>

body{
    margin:0;
    background:#000;
    color:#18d25a;
    font-family:"Courier New", monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.terminal{

width:850px;
max-width:90%;
border:1px solid #18d25a;
padding:30px;
box-shadow:0 0 15px rgba(24,210,90,.2);
background:#000;

}

#boot{

white-space:pre-line;
font-size:18px;
line-height:1.7;

}

.cursor{

display:inline-block;
width:10px;
background:#18d25a;
animation:blink 1s infinite;

}

@keyframes blink{

50%{
opacity:0;
}

}

.login{

display:none;
margin-top:30px;
animation:fade .8s;

}

input{

width:100%;
background:#000;
border:none;
border-bottom:1px solid #18d25a;
color:#18d25a;
font-size:18px;
padding:10px 0;
font-family:inherit;
margin-bottom:20px;
outline:none;

}

button{

background:#000;
color:#18d25a;
border:1px solid #18d25a;
padding:12px 25px;
font-family:inherit;
font-size:17px;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#18d25a;
color:#000;
box-shadow:0 0 10px #18d25a;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.title{

font-size:24px;
margin-bottom:20px;
letter-spacing:2px;

}

.footer{

margin-top:30px;
font-size:13px;
opacity:.6;

}

</style>
</head>

<body>

<div class="terminal">

<div class="title">
CEREBRO OPERATING SYSTEM v7.6
</div>

<div id="boot"></div>

<div class="login" id="login">

<p>> SECURITY LOGIN</p>

<label>AGENT ID</label>
<input type="text">

<label>ACCESS CODE</label>
<input type="password">

<button onclick="location.href='Página: Página principal'">
ACCESS DATABASE
</button>

<div class="footer">

PROPERTY OF THE XAVIER INSTITUTE<br>
AUTHORIZED PERSONNEL ONLY

</div>

</div>

</div>

<script>

const lines = [

"> Initializing Cerebro...",
"> Loading neural interface...............OK",
"> Verifying X-Gene database..............OK",
"> Connecting to Cerebro core............OK",
"> Security protocols....................ONLINE",
"> Mutant detection grid.................ACTIVE",
"",
"> SYSTEM READY",
"",
"> PLEASE AUTHENTICATE",
""

];

let i=0;

const boot=document.getElementById("boot");

function typeLine(){

if(i<lines.length){

boot.innerHTML+=lines[i]+"<br>";

i++;

setTimeout(typeLine,450);

}else{

boot.innerHTML+='<span class="cursor">&nbsp;</span>';

document.getElementById("login").style.display="block";

}

}

typeLine();

</script>

</body>
</html>
